name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository (actions/checkout v4)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: cp app/.env.example app/.env
      - run: ./test.sh unit
      - run: ./test.sh instance
      - run: ./test.sh preview
  e2e:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft || !contains(github.event.pull_request.labels.*.name, 'ci:skip-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository (actions/checkout v4)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: cp app/.env.example app/.env
      - run: ./test.sh e2e
  snapshots:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft || !contains(github.event.pull_request.labels.*.name, 'ci:skip-snap')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository (actions/checkout v4)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: cp app/.env.example app/.env
      - run: ./test.sh snap
      - name: Keep the snapshot results (actions/upload-artifact v4)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: snapshots
          path: |
            app/e2e/results
            app/e2e/report
