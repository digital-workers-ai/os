name: cla

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  cla:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - if: ${{ !contains(github.event.pull_request.body, '[x] I have read [CLA.md](CLA.md) and agree to it') }}
        run: |
          echo "::error::Tick the CLA line in the pull request description: [x] I have read [CLA.md](CLA.md) and agree to it"
          exit 1
