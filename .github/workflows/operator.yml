name: operator

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      focus:
        type: string
        default: ""
  issue_comment:
    types: [created]

jobs:
  gate:
    if: |
      vars.OPERATOR_ENABLED == 'true' && (
       github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issue_comment' &&
        !github.event.issue.pull_request &&
        github.event.comment.user.type != 'Bot' &&
        contains(github.event.issue.labels.*.name, 'operator') &&
        !contains(github.event.issue.labels.*.name, 'approved') &&
        !startsWith(github.event.comment.body, 'lgtm') &&
        !startsWith(github.event.comment.body, 'approve'))
      )
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.permission.outputs.allowed }}
    steps:
      - name: Admit only the repository owner or an admin
        id: permission
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.event.sender.login || github.actor }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          permission=$(gh api "repos/${{ github.repository }}/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || echo none)
          echo "actor=$ACTOR permission=$permission"
          if [ "$permission" = "admin" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi
  operator:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: operator-${{ github.event.issue.number || 'daily' }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: read
      id-token: write
      actions: read
    env:
      OPERATOR_DATABASE_URL: postgresql://os:os@localhost:5442/os
      OPERATOR_API: http://localhost:8092
    steps:
      - name: Acknowledge the comment on the issue
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "Reading the comment now."
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Copy the example env
        run: cp app/.env.example app/.env
      - name: Read the operator's model
        id: agent
        run: echo "model=$(yq -r .model agents/operator.yaml)" >> "$GITHUB_OUTPUT"
      - name: Refuse two snapshot sources
        if: vars.OPERATOR_SNAPSHOT_S3 != '' && vars.OPERATOR_SNAPSHOT_GCS != ''
        run: |
          echo "::error::OPERATOR_SNAPSHOT_S3 and OPERATOR_SNAPSHOT_GCS are both set; the operator restores from one cloud, unset the other"
          exit 1
      - name: Start postgres
        run: docker compose -f app/docker-compose.yml up -d --build --wait postgres
      - name: Assume the AWS role
        if: vars.OPERATOR_SNAPSHOT_S3 != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.OPERATOR_AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Fetch the dump from S3
        if: vars.OPERATOR_SNAPSHOT_S3 != ''
        run: aws s3 cp "s3://${{ vars.OPERATOR_SNAPSHOT_S3 }}" os.dump
      - name: Authenticate to Google Cloud
        if: vars.OPERATOR_SNAPSHOT_GCS != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.OPERATOR_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.OPERATOR_GCP_SERVICE_ACCOUNT }}
      - name: Fetch the dump from Cloud Storage
        if: vars.OPERATOR_SNAPSHOT_GCS != ''
        run: gcloud storage cp "gs://${{ vars.OPERATOR_SNAPSHOT_GCS }}" os.dump
      - name: Restore the dump into the copy
        if: vars.OPERATOR_SNAPSHOT_S3 != '' || vars.OPERATOR_SNAPSHOT_GCS != ''
        run: docker compose -f app/docker-compose.yml exec -T postgres pg_restore -U os -d os --no-owner --no-privileges --exit-on-error < os.dump
      - name: Sync and rebuild the mock estate
        if: vars.OPERATOR_SNAPSHOT_S3 == '' && vars.OPERATOR_SNAPSHOT_GCS == ''
        run: |
          docker compose -f app/docker-compose.yml up -d --build --wait mock backend
          post_api() {
            for _ in $(seq 5); do
              code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$OPERATOR_API/api/$1")
              echo "POST /api/$1 -> $code"
              case "$code" in
                2*) return 0 ;;
                409) sleep 3 ;;
                *) return 1 ;;
              esac
            done
            return 1
          }
          post_api sync
          post_api rebuild
          post_api metrics/snapshots
      - name: Boot the backend against the copy
        run: docker compose -f app/docker-compose.yml up -d --build --wait backend
      - name: Report a backend that would not boot
        if: failure()
        run: |
          {
            echo "## backend logs"
            echo '```'
            docker compose -f app/docker-compose.yml logs --tail 60 backend
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run the operator
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.OPERATOR_GITHUB_PAT }}
          show_full_output: true
          prompt: |
            Read .claude/skills/dw-operator/SKILL.md and follow it.
            Event: ${{ github.event_name }}.
            Issue: ${{ github.event.issue.number || 'none' }}.
            Focus: ${{ inputs.focus || 'none' }}.
          claude_args: |
            --model ${{ steps.agent.outputs.model }}
            --max-turns 200
            --allowedTools "Read,Grep,Glob,Edit,Bash(psql:*),Bash(curl:*),Bash(docker compose:*),Bash(git diff:*),Bash(git checkout --:*),Bash(git log:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue create:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh issue close:*),Bash(gh pr list:*)"
      - name: Report cost and the run summary
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          [ -f "$EXEC_FILE" ] || exit 0
          BODY=$(python3 .github/scripts/report_run.py "Operator run")
          [ -n "$BODY" ] || exit 0
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$BODY" || true
          else
            echo "$BODY" >> "$GITHUB_STEP_SUMMARY"
          fi
