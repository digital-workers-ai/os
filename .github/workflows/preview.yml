# Private, per-pull-request previews of DW-OS on Google Cloud Run.
#
# A preview is one pull request's commit running on stand-in vendor data, with
# every AI feature off and no model key anywhere: the backend and the mock
# providers in one service (os-pr-<N>-api), each frontend app in its own
# (os-pr-<N>-<app>), on a fresh database (os_pr_<N>). Nothing is public: every
# service refuses a request without a Google identity token.
#
# Two triggers:
#   workflow_dispatch with pr=<N> and sha=<its head commit> deploys, or
#     rebuilds from scratch, the preview of #<N> at that commit:
#       gh workflow run preview.yml -f pr=<N> -f sha=<head commit>
#     Dispatched with pr empty, it runs the sweep instead.
#   schedule, hourly, runs the sweep: it deletes the previews of closed pull
#     requests and stops the database instance once none is left.
#
# A preview is opened from a laptop through gcloud's local proxy, handed a token
# for the os-preview-viewer service account that only this preview's apps accept:
#   gcloud run services proxy os-pr-<N>-console --region us-central1 \
#     --project <PREVIEW_PROJECT> --port 3192 \
#     --token "$(gcloud auth print-identity-token --audiences os-pr-<N> --include-email \
#       --impersonate-service-account os-preview-viewer@<PREVIEW_PROJECT>.iam.gserviceaccount.com)"
# then http://localhost:3192. The deploy posts the exact command for every app
# on the pull request.
#
# The repository is public, so the workflow assumes hostile input: it never
# runs a fork's code, it deploys only the commit it was told to, it builds pull
# request code before holding any cloud credential, it pins every third-party
# action and base image, and it never splices an expression into a shell script.
name: preview

on:
  workflow_dispatch:
    inputs:
      pr:
        type: string
        default: ""
      sha:
        type: string
        default: ""
  schedule:
    - cron: "17 * * * *"

# The default GITHUB_TOKEN gets no permission at all; each job asks for the
# few it needs.
permissions: {}

# Explicit bash runs with -e and -o pipefail: any failing command, including
# one inside a pipe, fails the step.
defaults:
  run:
    shell: bash

# Everything is derived from three repository variables: PREVIEW_PROJECT,
# PREVIEW_PROJECT_NUMBER and PREVIEW_OWNER_ID. A fork or an instance copy of
# this template has none of them, so both jobs skip. The CLOUDSDK_* values give
# every gcloud call its project and region and stop it from prompting.
env:
  CLOUDSDK_CORE_PROJECT: ${{ vars.PREVIEW_PROJECT }}
  CLOUDSDK_RUN_REGION: us-central1
  CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
  DEPLOY_PROVIDER: projects/${{ vars.PREVIEW_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/os-repo
  SWEEP_PROVIDER: projects/${{ vars.PREVIEW_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-sweep/providers/os-repo-sweep
  DEPLOY_SA: os-preview-deploy@${{ vars.PREVIEW_PROJECT }}.iam.gserviceaccount.com
  SWEEP_SA: os-preview-sweep@${{ vars.PREVIEW_PROJECT }}.iam.gserviceaccount.com
  API_SA: os-preview-api@${{ vars.PREVIEW_PROJECT }}.iam.gserviceaccount.com
  WEB_SA: os-preview-web@${{ vars.PREVIEW_PROJECT }}.iam.gserviceaccount.com
  VIEWER_SA: os-preview-viewer@${{ vars.PREVIEW_PROJECT }}.iam.gserviceaccount.com
  REGISTRY: us-central1-docker.pkg.dev/${{ vars.PREVIEW_PROJECT }}/os-previews
  BUCKET: ${{ vars.PREVIEW_PROJECT }}
  INSTANCE: os-previews
  CONNECTION: ${{ vars.PREVIEW_PROJECT }}:us-central1:os-previews

jobs:
  # Deploys the preview of one pull request at one commit. Only the owner's
  # account may dispatch it, and Google Cloud trusts only this file on main (see
  # the first authentication step), so a pull request cannot change what runs here.
  deploy:
    # The actor and attempt checks fail fast where Google Cloud refuses anyway. A
    # re-run keeps the original actor, so without the attempt check anyone allowed
    # to re-run workflows could replay the owner's dispatch.
    if: vars.PREVIEW_PROJECT != '' && github.event_name == 'workflow_dispatch' && inputs.pr != '' && github.actor_id == vars.PREVIEW_OWNER_ID && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # One deploy per pull request at a time; a second dispatch waits for the first
    # instead of racing it.
    concurrency:
      group: preview-${{ inputs.pr }}
      cancel-in-progress: false
    # Read the code, comment on the pull request, and request the GitHub OIDC
    # token that Google Cloud exchanges for the deploy service account.
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      PR: ${{ inputs.pr }}
      SHA: ${{ inputs.sha }}
    steps:
      # A preview runs the pull request's code with cloud credentials behind it, so
      # only an open pull request whose branch lives in this repository qualifies:
      # its author already has write access here. A fork's pull request, or one
      # whose fork was deleted, is refused. The dispatch names the commit as well as
      # the number, and it must still be the pull request's head: the owner deploys
      # exactly the code they looked at, a push after the dispatch is refused rather
      # than deployed, and a re-run, which replays the same inputs, can never pick up
      # newer code. Both inputs must match strict patterns before they are used.
      # Values reach every script through env, never as expressions inside run:
      # an expression is pasted into the script as code before bash sees it, so
      # a crafted value could run commands; an environment variable stays data.
      - name: Admit only an open pull request from this repository at its head
        id: pull
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$PR" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr must be a pull request number"
            exit 1
          fi
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be a full 40-character commit hash"
            exit 1
          fi
          pull=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")
          head_repo=$(jq -r '.head.repo.full_name // ""' <<< "$pull")
          head_sha=$(jq -r .head.sha <<< "$pull")
          state=$(jq -r .state <<< "$pull")
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::#$PR comes from ${head_repo:-a deleted repository}; previews run only branches of $GITHUB_REPOSITORY"
            exit 1
          fi
          if [ "$state" != open ]; then
            echo "::error::#$PR is $state"
            exit 1
          fi
          if [ "$head_sha" != "$SHA" ]; then
            echo "::error::#$PR's head is $head_sha, not $SHA; dispatch again with the commit to deploy"
            exit 1
          fi
          echo "tag=pr-$PR-${SHA:0:12}" >> "$GITHUB_OUTPUT"
      # Check out the commit the dispatch named, never the branch, so nothing pushed
      # since can slip in. The token is not left in .git/config, out of reach of the
      # code about to be built.
      # Every third-party action is pinned to a full commit SHA, its tag kept in the
      # step name: a tag can be moved to other code, a commit cannot.
      - name: Check out the named commit (actions/checkout v4)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      # Prove the checkout is that commit, then find the apps: every app/*/ with a
      # vite.config.ts becomes its own service. A name must be a valid service name,
      # which also keeps it safe to write into a step output. api and seed are
      # reserved: an app with either name would collide with the preview's own API
      # service or seed job.
      # Known apps keep fixed local proxy ports; a new one takes the next from 3196.
      - name: Confirm the commit and list the apps
        id: apps
        run: |
          if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "::error::checked out $(git rev-parse HEAD), expected $SHA"
            exit 1
          fi
          apps=""
          next=3196
          for config in app/*/vite.config.ts; do
            app=$(basename "$(dirname "$config")")
            if ! [[ "$app" =~ ^[a-z][a-z0-9-]*$ ]]; then
              echo "::error::app/$app cannot name a Cloud Run service"
              exit 1
            fi
            case "$app" in
              api|seed)
                echo "::error::app/$app is reserved for the preview's own os-pr-$PR-$app"
                exit 1
                ;;
              console) port=3192 ;;
              dashboard) port=3193 ;;
              spy) port=3194 ;;
              studio) port=3195 ;;
              *) port=$next; next=$((next + 1)) ;;
            esac
            apps="$apps $app:$port"
          done
          echo "apps=${apps# }" >> "$GITHUB_OUTPUT"
      # Build every image before authenticating: the pull request's Dockerfiles and
      # npm scripts run here, and the runner holds no cloud credential yet for them
      # to reach. Images are tagged
      # pr-<N>-<first 12 characters of the commit>, which is how the sweep finds them.
      - name: Build the images
        env:
          TAG: ${{ steps.pull.outputs.tag }}
          APPS: ${{ steps.apps.outputs.apps }}
        run: |
          docker build -f app/preview/api.Dockerfile -t "$REGISTRY/api:$TAG" .
          for entry in $APPS; do
            docker build -f app/preview/web.Dockerfile --build-arg APP="${entry%:*}" -t "$REGISTRY/web-${entry%:*}:$TAG" .
          done
      # Workload Identity Federation: GitHub's OIDC token for this run is exchanged
      # for the deploy service account, with no key stored anywhere. The provider's
      # condition admits only this repository and its owner (by numeric id, which a
      # renamed or recreated repository cannot reuse), only a workflow_dispatch by
      # the owner's account on its first attempt, only GitHub-hosted runners, and
      # only this workflow file on main. A pull_request run, a fork, a re-run, or an
      # edited copy of this file on a branch cannot get credentials. The sweep signs
      # in through a separate pool as a service account that cannot deploy.
      - name: Authenticate to Google Cloud (google-github-actions/auth v2)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.DEPLOY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      # cloud-run-proxy is installed up front: the smoke test starts one proxy per
      # app at once, and they would otherwise race to install it.
      - name: Set up gcloud (google-github-actions/setup-gcloud v2)
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          install_components: cloud-run-proxy
      - name: Push the images
        env:
          TAG: ${{ steps.pull.outputs.tag }}
          APPS: ${{ steps.apps.outputs.apps }}
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev
          docker push "$REGISTRY/api:$TAG"
          for entry in $APPS; do
            docker push "$REGISTRY/web-${entry%:*}:$TAG"
          done
      # The shared Postgres instance is kept stopped while no preview exists. A cold
      # start can outlast gcloud's own wait, so the start is requested with --async
      # and polled for up to 20 minutes. The state alone proves nothing: Cloud SQL
      # reports a stopped instance as RUNNABLE, and gcloud shows STOPPED only from
      # the activation policy, which flips before the start finishes. So the loop
      # also waits until no operation on the instance is pending, which covers a
      # start still running from an earlier attempt too.
      - name: Start the database instance
        run: |
          state() { gcloud sql instances describe "$INSTANCE" --format 'value(state)'; }
          pending() { gcloud sql operations list --instance "$INSTANCE" --filter 'status != DONE' --format 'value(name)'; }
          if [ "$(state)" != RUNNABLE ]; then
            gcloud sql instances patch "$INSTANCE" --activation-policy ALWAYS --async
          fi
          for _ in $(seq 120); do
            if [ "$(state)" = RUNNABLE ] && [ -z "$(pending)" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::$INSTANCE did not start within 20 minutes"
          exit 1
      # Every deploy starts the preview's data over. The API service goes first so
      # its database connections close and the database can be dropped.
      - name: Start the preview's database and media over
        run: |
          if gcloud run services describe "os-pr-$PR-api" >/dev/null 2>&1; then
            gcloud run services delete "os-pr-$PR-api"
          fi
          if gcloud sql databases describe "os_pr_$PR" --instance "$INSTANCE" >/dev/null 2>&1; then
            gcloud sql databases delete "os_pr_$PR" --instance "$INSTANCE"
          fi
          gcloud sql databases create "os_pr_$PR" --instance "$INSTANCE"
          if gcloud storage ls "gs://$BUCKET/pr-$PR/" >/dev/null 2>&1; then
            gcloud storage rm --recursive "gs://$BUCKET/pr-$PR/"
          fi
      # The seed job runs the API image once: sync and rebuild from the stand-ins,
      # then the demo data, as ./test.sh snap does. The API service then serves that
      # database. Both share the settings: stand-ins only, every AI feature off, the
      # clock pinned, and the database password read from Secret Manager at run time,
      # never written here. The bucket is mounted with only-dir, so a preview sees
      # only its own pr-<N>/ folder, owned by the image's non-root user (10001).
      # No IAM is set here: the deploy service account cannot change who may call a
      # service, so a new service is private, and only grants made outside this
      # repository open it. Those are plain project-level invoker grants to
      # os-preview-web and os-preview-viewer, not scoped by service name; what keeps
      # a reviewer's token to one preview is its audience (see Serve the apps).
      - name: Seed and serve the API
        env:
          TAG: ${{ steps.pull.outputs.tag }}
        run: |
          settings="STAND_INS_ONLY=true,MARKETER_DAILY=false,STUDIO_ENABLED=false,ENRICHMENT_ENABLED=false,COACHING_ENABLED=false,CONVERSATION_ENABLED=false,EMBEDDINGS_ENABLED=false,RERANK_ENABLED=false,CLOCK_PINNED_AT=2026-09-04T12:00:00Z,MEDIA_DIR=/media,DB_USER=os_preview,DB_NAME=os_pr_$PR,DB_INSTANCE=$CONNECTION"
          shared=(
            --image "$REGISTRY/api:$TAG"
            --service-account "$API_SA"
            --set-cloudsql-instances "$CONNECTION"
            --add-volume "name=media,type=cloud-storage,bucket=$BUCKET,mount-options=only-dir=pr-$PR;uid=10001;gid=10001"
            --add-volume-mount volume=media,mount-path=/media
            --cpu 1
            --memory 2Gi
            --set-env-vars "$settings"
            --set-secrets DB_PASSWORD=os-preview-db-password:latest
          )
          gcloud run jobs deploy "os-pr-$PR-seed" "${shared[@]}" \
            --command /preview/seed.sh \
            --task-timeout 30m \
            --max-retries 0 \
            --execute-now --wait
          gcloud run deploy "os-pr-$PR-api" "${shared[@]}" \
            --port 8000 \
            --min-instances 0 \
            --max-instances 1 \
            --timeout 300 \
            --execution-environment gen2 \
            --startup-probe tcpSocket.port=8000,periodSeconds=10,timeoutSeconds=5,failureThreshold=60
      # Each app's server forwards /api to the API with its own service account's
      # identity token. Like the API, every app is private from the start. The
      # custom audience os-pr-<N> is what the smoke test's token and a reviewer's
      # viewer token are minted for, so each opens this preview's apps and no other
      # service.
      - name: Serve the apps
        env:
          TAG: ${{ steps.pull.outputs.tag }}
          APPS: ${{ steps.apps.outputs.apps }}
        run: |
          api_url=$(gcloud run services describe "os-pr-$PR-api" --format 'value(status.url)')
          for entry in $APPS; do
            gcloud run deploy "os-pr-$PR-${entry%:*}" \
              --image "$REGISTRY/web-${entry%:*}:$TAG" \
              --port 8080 \
              --min-instances 0 \
              --max-instances 1 \
              --memory 256Mi \
              --service-account "$WEB_SA" \
              --set-env-vars "API_URL=$api_url" \
              --set-custom-audiences "os-pr-$PR"
          done
      # A second token, for the smoke test only. gcloud's proxy cannot mint an
      # identity token from a federated login, so it is handed one. Cloud Run accepts
      # a token whose audience is the service's URL or one of its custom audiences;
      # the per-PR audience lets one token open every app of this preview and no
      # other service. It is minted here, not at the first login, because it expires
      # within the hour.
      - name: Mint the smoke test's identity token (google-github-actions/auth v2)
        id: token
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.DEPLOY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
          token_format: id_token
          id_token_audience: os-pr-${{ inputs.pr }}
          id_token_include_email: true
      # The path a reviewer takes: a local proxy per app, then the app's page and
      # its /api/health, which goes through the app to the API. Instances start
      # cold, so each check retries for a few minutes.
      - name: Open every app through the proxy
        env:
          APPS: ${{ steps.apps.outputs.apps }}
          TOKEN: ${{ steps.token.outputs.id_token }}
        run: |
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT
          for entry in $APPS; do
            gcloud run services proxy "os-pr-$PR-${entry%:*}" --port "${entry#*:}" --token "$TOKEN" &
          done
          check() {
            for _ in $(seq 30); do
              if result=$(curl -s --max-time 120 -o /dev/null -w '%{http_code} %{content_type}' "$1"); then
                case "$result" in
                  "200 $2"*) echo "$1 -> $result"; return 0 ;;
                esac
              fi
              sleep 10
            done
            echo "::error::$1 answered ${result:-nothing}"
            return 1
          }
          for entry in $APPS; do
            check "http://localhost:${entry#*:}/" text/html
            check "http://localhost:${entry#*:}/api/health"
          done
      # One comment per pull request, found by its author and first line and edited
      # in place on every redeploy. Its commands hand the proxy an os-preview-viewer
      # token for this preview's audience, so the bearer token preview code receives
      # opens only this preview's apps and is never the reviewer's own login.
      - name: Post the commands on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          APPS: ${{ steps.apps.outputs.apps }}
        run: |
          {
            echo "Preview for #$PR"
            echo
            echo "Commit $SHA on stand-in data, every AI feature off. Run an app's command, then open its URL."
            echo
            echo "Each command hands the proxy an os-preview-viewer token that lasts about an hour (run the command again after that) and opens only this pull request's apps, which keeps your own login away from preview code; minting it needs the Service Account Token Creator role on os-preview-viewer."
            for entry in $APPS; do
              echo
              echo "**${entry%:*}** at http://localhost:${entry#*:}"
              echo '```'
              echo "gcloud run services proxy os-pr-$PR-${entry%:*} --region $CLOUDSDK_RUN_REGION --project $CLOUDSDK_CORE_PROJECT --port ${entry#*:} --token \"\$(gcloud auth print-identity-token --impersonate-service-account $VIEWER_SA --audiences os-pr-$PR --include-email)\""
              echo '```'
            done
          } > "$RUNNER_TEMP/comment.md"
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | split(\"\n\")[0] | rtrimstr(\"\r\")) == \"Preview for #$PR\") | .id" | sed -n 1p)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$RUNNER_TEMP/comment.md" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F "body=@$RUNNER_TEMP/comment.md" >/dev/null
          fi

  # Removes what closed pull requests left behind, then stops the database
  # instance if no preview needs it. It signs in through its own pool and
  # provider as os-preview-sweep, which can delete previews and stop the instance
  # but cannot deploy anything. Every deletion tolerates pieces that are already
  # gone, so a sweep can be rerun at any time.
  sweep:
    # The event is checked by name because inputs.pr is also empty on an event
    # that has no inputs; a sweep by hand, like a deploy, is the owner's alone.
    if: vars.PREVIEW_PROJECT != '' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.pr == '' && github.actor_id == vars.PREVIEW_OWNER_ID))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: preview-sweep
      cancel-in-progress: false
    # actions: read lets the last step see whether a deploy is in progress.
    permissions:
      actions: read
      pull-requests: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud (google-github-actions/auth v2)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.SWEEP_PROVIDER }}
          service_account: ${{ env.SWEEP_SA }}
      - name: Set up gcloud (google-github-actions/setup-gcloud v2)
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      # Pull request numbers come from every service, job and (while the instance
      # runs) database named after one, so a deploy that failed halfway is found
      # too. A preview is deleted only once GitHub says its pull request is closed,
      # merged included; a number GitHub cannot resolve is left alone. The name
      # lists are split unquoted, so set -f keeps a name from ever being expanded
      # as a file pattern. Images lose only this pull request's tags; a version is
      # deleted only when those were all its tags, and deleting by digest is refused
      # while any tag remains, so a version another pull request tags is kept.
      - name: Delete the previews of closed pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -f
          services=$(gcloud run services list --format 'value(metadata.name)')
          jobs=$(gcloud run jobs list --format 'value(metadata.name)')
          databases=""
          if [ "$(gcloud sql instances describe "$INSTANCE" --format 'value(state)')" = RUNNABLE ]; then
            databases=$(gcloud sql databases list --instance "$INSTANCE" --format 'value(name)')
          fi
          images=$(gcloud artifacts docker images list "$REGISTRY" --include-tags --format json)
          prs=$(printf '%s\n' $services $jobs $databases | sed -nE 's/^os-pr-([0-9]+)-.*$/\1/p; s/^os_pr_([0-9]+)$/\1/p' | sort -un)
          for pr in $prs; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .state) || continue
            if [ "$state" != closed ]; then
              continue
            fi
            echo "==> #$pr is closed"
            for name in $services; do
              case "$name" in
                "os-pr-$pr-"*) gcloud run services delete "$name" ;;
              esac
            done
            for name in $jobs; do
              case "$name" in
                "os-pr-$pr-"*) gcloud run jobs delete "$name" ;;
              esac
            done
            for name in $databases; do
              case "$name" in
                "os_pr_$pr") gcloud sql databases delete "$name" --instance "$INSTANCE" ;;
              esac
            done
            if gcloud storage ls "gs://$BUCKET/pr-$pr/" >/dev/null 2>&1; then
              gcloud storage rm --recursive "gs://$BUCKET/pr-$pr/"
            fi
            for tag in $(jq -r --arg prefix "pr-$pr-" '.[] | .package as $package | .tags[]? | select(startswith($prefix)) | "\($package):\(.)"' <<< "$images"); do
              gcloud artifacts docker tags delete "$tag"
            done
            for version in $(jq -r --arg prefix "pr-$pr-" '.[] | select(any(.tags[]?; startswith($prefix)) and all(.tags[]?; startswith($prefix))) | "\(.package)@\(.version)"' <<< "$images"); do
              gcloud artifacts docker images delete "$version"
            done
          done
      # Stop the instance only when no preview API remains and no other run of this
      # workflow is in progress: a deploy may have just started the instance without
      # having created its API service yet, and stopping it would break that deploy's
      # seed. A deploy builds for minutes before it touches the instance, so one that
      # starts after this check cannot be caught out. Stopping is requested with
      # --async and polled for the same reasons as starting.
      - name: Stop the database instance once no preview remains
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state() { gcloud sql instances describe "$INSTANCE" --format 'value(state)'; }
          pending() { gcloud sql operations list --instance "$INSTANCE" --filter 'status != DONE' --format 'value(name)'; }
          remaining=$(gcloud run services list --filter 'metadata.name ~ ^os-pr-[0-9]+-api$' --format 'value(metadata.name)')
          deploying=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow preview.yml --status in_progress --json databaseId --jq "map(select(.databaseId != $GITHUB_RUN_ID)) | length")
          if [ -n "$remaining" ] || [ "$deploying" != 0 ] || [ "$(state)" != RUNNABLE ]; then
            exit 0
          fi
          gcloud sql instances patch "$INSTANCE" --activation-policy NEVER --async
          for _ in $(seq 120); do
            if [ "$(state)" = STOPPED ] && [ -z "$(pending)" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::$INSTANCE did not stop within 20 minutes"
          exit 1
