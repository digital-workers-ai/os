name: operator-build

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

jobs:
  build:
    if: |
      (github.event_name == 'issues' &&
       github.event.label.name == 'approved' &&
       contains(github.event.issue.labels.*.name, 'operator')) ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' &&
       contains(github.event.issue.labels.*.name, 'operator') &&
       (contains(github.event.issue.labels.*.name, 'approved') ||
        (contains(github.event.issue.labels.*.name, 'awaiting-approval') &&
         (startsWith(github.event.comment.body, 'lgtm') || startsWith(github.event.comment.body, 'approve')) &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: operator-build-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} \
            --add-label approved --remove-label awaiting-approval 2>/dev/null || true
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} \
            --body "Building now; the pull request will be linked here."
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: cp app/.env.example app/.env
      - id: agent
        run: echo "model=$(yq -r .model agents/operator.yaml)" >> "$GITHUB_OUTPUT"
      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.OPERATOR_GITHUB_PAT }}
          branch_prefix: "operator/"
          show_full_output: true
          prompt: |
            Read .claude/skills/dw-operator-build/SKILL.md and follow it for issue ${{ github.event.issue.number }}. Event: ${{ github.event_name }}.
          claude_args: |
            --model ${{ steps.agent.outputs.model }}
            --max-turns 150
            --allowedTools "Read,Grep,Glob,Edit,Write,Agent,Bash(git:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr create:*),Bash(gh pr comment:*),Bash(./test.sh:*),Bash(./format.sh),Bash(docker compose:*),Bash(python:*),Bash(npm:*)"
      - if: always() && steps.claude.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -f "$EXEC_FILE" ] || exit 0
          BODY=$(python3 - <<'PY'
          import json, os
          try:
              raw = open(os.environ["EXEC_FILE"]).read().strip()
              entries = json.loads(raw) if raw.startswith("[") else [json.loads(l) for l in raw.splitlines() if l.strip()]
              r = next((e for e in reversed(entries) if e.get("type") == "result"), {})
              cost = r.get("total_cost_usd")
              mins, secs = divmod(int(r.get("duration_ms", 0) / 1000), 60)
              cost_s = f"${cost:.2f}" if isinstance(cost, (int, float)) else "n/a"
              print(f"Build run: {cost_s} API · {r.get('num_turns', '?')} turns · {mins}m{secs:02d}s · [logs]({os.environ['RUN_URL']})")
          except Exception:
              pass
          PY
          )
          [ -n "$BODY" ] && gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "$BODY" || true
