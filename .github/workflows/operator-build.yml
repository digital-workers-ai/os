name: operator-build

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

jobs:
  gate:
    if: |
      (github.event_name == 'issues' &&
       github.event.label.name == 'approved' &&
       contains(github.event.issue.labels.*.name, 'operator')) ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' &&
       contains(github.event.issue.labels.*.name, 'operator') &&
       (contains(github.event.issue.labels.*.name, 'approved') ||
        (contains(github.event.issue.labels.*.name, 'awaiting-approval') &&
         (startsWith(github.event.comment.body, 'lgtm') || startsWith(github.event.comment.body, 'approve')))))
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.permission.outputs.allowed }}
    steps:
      - name: Admit only the repository owner or an admin
        id: permission
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.event.sender.login || github.actor }}
        run: |
          permission=$(gh api "repos/${{ github.repository }}/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || echo none)
          echo "actor=$ACTOR permission=$permission"
          if [ "$permission" = "admin" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: operator-build-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - name: Settle labels and acknowledge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} \
            --add-label approved --remove-label awaiting-approval 2>/dev/null || true
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} \
            --body "Building now; the pull request will be linked here."
      - name: Check out with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy the example env
        run: cp app/.env.example app/.env
      - name: Read the operator's model
        id: agent
        run: echo "model=$(yq -r .model agents/operator.yaml)" >> "$GITHUB_OUTPUT"
      - name: Run the build
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.OPERATOR_GITHUB_PAT }}
          branch_prefix: "operator/"
          show_full_output: true
          prompt: |
            Read .claude/skills/dw-operator-build/SKILL.md and follow it for issue ${{ github.event.issue.number }}. Event: ${{ github.event_name }}.
          claude_args: |
            --model ${{ steps.agent.outputs.model }}
            --max-turns 150
            --allowedTools "Read,Grep,Glob,Edit,Write,Agent,Bash(git:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr create:*),Bash(gh pr comment:*),Bash(./test.sh:*),Bash(./format.sh),Bash(docker compose:*),Bash(python:*),Bash(npm:*)"
      - name: Report the run's cost
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -f "$EXEC_FILE" ] || exit 0
          BODY=$(python3 .github/scripts/report_run.py "Build run")
          [ -n "$BODY" ] && gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "$BODY" || true
