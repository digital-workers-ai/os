  label: Facebook
  parent: social
  range: true
  filter:
    platform: facebook
  sections:
    - label: Audience
      cards: [social_reach, social_impressions, social_engaged, social_reach_by_day, social_engaged_by_day]
    - label: Followers
      cards: [social_follows, social_unfollows, social_profile_views, social_follows_by_day]
    - label: Posts
      cards: [posts, post_reach, post_interactions, post_engagement_rate, post_interactions_by_day]
    - label: Engagement
      cards: [post_likes, post_comments, post_shares, post_clicks]
    - label: Post types
      cards: [posts_by_post_type, likes_by_post_type, reach_by_post_type]
    - label: Top posts
      cards:
        - table: social_post
          label: Top Posts by Reach
          rank: reach
          columns: [name, category, posted_at, reach, interactions]
          window_attr: posted_at
          limit: 10
        - table: social_post
          label: Top Posts by Likes
          rank: likes
          columns: [name, category, posted_at, likes, comments, shares]
          window_attr: posted_at
          limit: 10
