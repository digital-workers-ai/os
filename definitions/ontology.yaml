entities:
  company:
    description: An organization the business sells to or serves.
    synonyms: [client, account, customer]
    attrs:
      domain: string
      industry: string
      name: string
    identity:
      - domain
  person:
    description: A human the business knows — a contact, a lead or a user at a company.
    synonyms: [contact, lead]
    attrs:
      email: string
      name: string
      phone: string
      title: string
      external_ref: string
    identity:
      - email
      - external_ref
    identity_scope:
      external_ref: tenant
    candidates:
      name: name
      corroborate:
        - phone
        - email_domain
  deal:
    description: A sales opportunity with a value and a forecast close date.
    synonyms: [opportunity]
    attrs:
      name: string
      amount: number
      status: string
      closed_at: date
      currency: string
      account_ref: string
      owner: string
  order:
    description: A completed purchase placed by a person.
    attrs:
      amount: number
      currency: string
      status: string
      email: string
      placed_at: date
  product:
    description: Something the business sells, with a price and a catalogue code.
    attrs:
      name: string
      currency: string
      status: string
      category: string
      sku: string
      price: number
  subscription:
    description: A recurring plan a company pays for, month after month.
    synonyms: [plan]
    attrs:
      customer_ref: string
      mrr: number
      currency: string
      status: string
      started_at: date
  ticket:
    description: A support request raised by a customer and worked to a close.
    synonyms: [case, support request]
    attrs:
      subject: string
      status: string
      priority: string
      channel: string
      email: string
      organization_ref: string
      opened_at: date
      name: string
      hours: number
      outcome: string
  message:
    description: An outbound message sent to a person, such as an SMS.
    attrs:
      status: string
      amount: number
      currency: string
      phone: string
      occurred_at: date
  meeting:
    description: A scheduled call, sometimes with a transcript of what was said.
    synonyms: [call]
    attrs:
      name: string
      status: string
      email: string
      domain: string
      transcript: string
      started_at: date
      ended_at: date
      account: string
      contact: string
      interest: string
      next_step: string
      next_step_date: date
      notes: string
  event:
    description: Something a person did in the product, at a point in time.
    attrs:
      event_name: string
      email: string
      occurred_at: date
  event_definition:
    description: The catalogue entry describing one kind of product event.
    attrs:
      name: string
      category: string
  ad_account:
    description: An advertising account holding campaigns and a budget.
    attrs:
      name: string
      status: string
      currency: string
      country: string
      budget: number
  email_campaign:
    description: One email send to a list, with its open and click counts.
    attrs:
      name: string
      subject: string
      status: string
      sends: number
      opens: number
      clicks: number
      sent_at: date
  audience:
    description: A named list of people a campaign can be sent to.
    attrs:
      name: string
      members: number
  campaign:
    description: A paid advertising campaign, with its spend and its results.
    attrs:
      name: string
      currency: string
      status: string
      category: string
      spend: number
      conversions: number
      clicks: number
      impressions: number
  traffic_report:
    description: One day of website traffic for one channel.
    attrs:
      report_date: date
      channel: string
      sessions: number
      users: number
      pageviews: number
  campaign_report:
    description: "One day of one paid campaign: what it spent and what it got."
    attrs:
      report_date: date
      campaign_ref: string
      spend: number
      clicks: number
      impressions: number
      conversions: number
      currency: string
      platform: string
      conversion_value: number
      landing_page_views: number
  social_post:
    description: One post on a social page or profile, with the engagement it drew.
    synonyms: [post]
    attrs:
      name: string
      platform: string
      category: string
      posted_at: date
      likes: number
      comments: number
      shares: number
      reach: number
      impressions: number
      clicks: number
      views: number
      saves: number
      interactions: number
  social_report:
    description: "One day of one social page or profile: who it reached and who followed."
    attrs:
      platform: string
      report_date: date
      reach: number
      impressions: number
      engaged: number
      follows: number
      unfollows: number
      profile_views: number
  visibility_check:
    description: One tracked query put to one search or answer engine on one day, with what came back.
    synonyms: [check]
    attrs:
      engine: string
      query: string
      checked_at: date
      answer: string
      sources: number
      brand_rank: number
  visibility_mention:
    description: One company found in one check, with where it came in the answer.
    synonyms: [mention]
    attrs:
      engine: string
      query: string
      checked_at: date
      company: string
      role: string
      rank: number
  competitor_post:
    description: One public post on a competitor's company page, with the engagement it drew.
    attrs:
      company: string
      platform: string
      name: string
      category: string
      posted_at: date
      likes: number
      comments: number
      url: string
      preview: string
      shares: number
      views: number
  ad:
    description: One creative a competitor is running, as the public ads library shows it.
    synonyms: [creative]
    attrs:
      company: string
      platform: string
      name: string
      category: string
      first_seen: date
      last_seen: date
      url: string
      preview: string
      media: string
      landing_url: string
  data_source:
    description: An upstream system feeding the estate.
    attrs:
      name: string
      category: string
  expense:
    description: Something bought for the business, read off its paper receipt.
    attrs:
      vendor: string
      date: date
      amount: number
      tax: number
      category: string
      currency: string
  expense_item:
    description: One line on a receipt.
    attrs:
      expense_ref: string
      description: string
      line_amount: number
  bill:
    description: A supplier's invoice the business has to pay.
    attrs:
      supplier: string
      invoice_number: string
      invoice_date: date
      due_date: date
      po_number: string
      amount: number
      tax: number
      currency: string
  bill_item:
    description: One line on a supplier's invoice.
    attrs:
      bill_ref: string
      description: string
      quantity: number
      unit_price: number
      line_amount: number
  odometer_reading:
    description: A vehicle's odometer at the start or the end of a business trip.
    attrs:
      vehicle: string
      odometer: number
      stage: string
      purpose: string
      miles: number
  stock_check:
    description: A store shelf, photographed and read left to right.
    attrs:
      location: string
      currency: string
  stock_check_item:
    description: One product on an audited shelf, with its facings and its shelf price.
    attrs:
      stock_check_ref: string
      name: string
      facings: number
      stock: string
      shelf_price: number
      price_check: string
  claim:
    description: Goods damaged on the way in or on the way out, with what the damage costs.
    attrs:
      item: string
      order_number: string
      damage: string
      severity: string
      amount: number
      currency: string
      description: string
  payment:
    description: A paper check received from a customer.
    attrs:
      payer: string
      name: string
      amount: number
      currency: string
      check_number: string
      check_date: date
      memo: string
  asset:
    description: A tool, laptop, vehicle or machine, known by the code on its tag.
    attrs:
      code: string
    identity:
      - code
  asset_move:
    description: An asset checked out or checked back in.
    attrs:
      code: string
      action: string
      location: string
      due_back: date
  stock_count:
    description: A count of what is on hand at one location.
    attrs:
      location: string
  stock_count_line:
    description: One product counted, with the change since its last count.
    attrs:
      stock_count_ref: string
      sku: string
      counted: number
      change: number
  check_in:
    description: An attendee admitted at the door of an event.
    attrs:
      event: string
      email: string
      admission: string
  service_record:
    description: A service logged on a machine, with the state it was left in.
    attrs:
      code: string
      work_done: string
      status: string
      next_service: date
  package:
    description: A package received at the front desk for a person or a team.
    attrs:
      tracking_number: string
      carrier: string
      recipient: string
      status: string
  batch_step:
    description: One production step a lot went through.
    attrs:
      lot: string
      step: string
      quantity: number
      unit: string
      note: string
  perio_chart:
    description: A periodontal exam of one patient.
    attrs:
      name: string
      exam_date: date
  perio_tooth:
    description: One tooth on a perio chart.
    attrs:
      perio_chart_ref: string
      tooth: string
      status: string
      mobility: string
  perio_site:
    description: One probing site of one tooth on a perio chart.
    attrs:
      perio_chart_ref: string
      tooth: string
      site: string
      depth: number
      bleeding: string
  inspection:
    description: A walk through a rental unit at move-in, at move-out or on a routine visit.
    attrs:
      property: string
      kind: string
  inspection_item:
    description: One item checked in one room of a property inspection.
    attrs:
      inspection_ref: string
      section: string
      item: string
      condition: string
      defect: string
      photo: string
  vehicle_check:
    description: A driver's check of a truck before the day's first trip.
    attrs:
      vehicle: string
      odometer: number
  vehicle_check_item:
    description: One item of a pre-trip check, passed or failed.
    attrs:
      vehicle_check_ref: string
      section: string
      item: string
      result: string
      defect: string
      photo: string
  temperature_check:
    description: A walk around the kitchen with the temperatures called out.
    attrs:
      shift: string
  temperature_reading:
    description: One temperature taken on a food safety walk.
    attrs:
      temperature_check_ref: string
      unit: string
      temperature: number
      action: string
  safety_walk:
    description: A walk around a job site looking for hazards.
    attrs:
      site: string
  safety_finding:
    description: One hazard found on a site safety walk.
    attrs:
      safety_walk_ref: string
      hazard: string
      severity: string
      location: string
      action: string
      photo: string
  visit_note:
    description: A vet's note for one visit, in SOAP order.
    attrs:
      name: string
      patient: string
      species: string
      weight: number
      subjective: string
      objective: string
      assessment: string
      plan: string
  delivery:
    description: A delivery handed to the customer at the door, with their signature.
    attrs:
      name: string
      order_number: string
      signed_by: string
      signature: string
      condition: string
      note: string
  service_part:
    description: A part used on a field service call.
    attrs:
      case_ref: string
      name: string
      quantity: number

attributes:
  external_ref:
    description: A tenant-scoped id another tool assigned to the person.
    synonyms: [user id, customer id]
  account_ref:
    description: The provider's id for the company a deal belongs to.
  customer_ref:
    description: The provider's id for the company a subscription belongs to.
  organization_ref:
    description: The provider's id for the company a ticket belongs to.
  industry:
    description: The sector the company works in, as its records classify it.
  mrr:
    description: "Monthly recurring revenue: a subscription's own, or the active total across a company's subscriptions."
  status:
    description: Where the record sits in its own lifecycle, folded to one vocabulary.
  category:
    description: The kind of thing the record is, as the source classifies it.
  channel:
    description: The route the contact or the traffic arrived through.
  sends:
    description: How many recipients the email campaign went to.
  members:
    description: How many people the audience holds.
  sessions:
    description: Visits to the site on the reporting day.
  users:
    description: Distinct people who visited the site on the reporting day.
  pageviews:
    description: Pages viewed on the site on the reporting day.
  report_date:
    description: The day the figures cover.
  event_name:
    description: What the person did, as the product names it.
  transcript:
    description: The written record of what was said on the call.
  budget:
    description: What the ad account is allowed to spend.
  spend:
    description: What the campaign spent, in total or on the reporting day.
  conversions:
    description: Actions the campaign counts as a result.
  impressions:
    description: How many times the post, the page or the campaign's ads were shown.
  priority:
    description: How urgent the ticket is, as support graded it.
  sku:
    description: The code that identifies the product in the catalogue.
  title:
    description: The person's job title.
  owner:
    description: Who is accountable for the deal.
  open_tickets:
    description: Support tickets raised by the company that are still open.
  last_meeting_at:
    description: When the person last attended a meeting.
  campaign_ref:
    description: The provider's id for the campaign a daily report belongs to.
  conversion_value:
    description: What the reporting day's conversions were worth, as the ad platform valued them.
  landing_page_views:
    description: How many ad clicks went on to load the landing page.
  platform:
    description: The network the post, the page or the campaign's ads live on.
  posted_at:
    description: When the post went live.
  likes:
    description: How many people liked the post.
  comments:
    description: How many comments the post drew.
  shares:
    description: How many times the post was shared.
  reach:
    description: How many distinct accounts the post or the page reached.
  clicks:
    description: How many clicks the post or the campaign's ads drew.
  views:
    description: How many times the post's video was watched.
  saves:
    description: How many people saved the post.
  interactions:
    description: Likes, comments and shares on the post, added up.
  engaged:
    description: Accounts that interacted with the page on the reporting day.
  follows:
    description: New followers gained on the reporting day.
  unfollows:
    description: Followers lost on the reporting day.
  profile_views:
    description: Visits to the page or profile on the reporting day.
  engine:
    description: Which search or answer engine the query was put to.
  query:
    description: The tracked query, as Spy asked it.
  checked_at:
    description: The day the query was put to the engine.
  answer:
    description: The text the engine answered with.
  sources:
    description: How many distinct pages the engine showed or cited.
  brand_rank:
    description: Where the brand came in the answer, absent when it was not there.
  company:
    description: The tracked company the record is about, brand or competitor.
  role:
    description: Whether the company is the brand or a competitor.
  rank:
    description: Where the company came in the answer, first is one.
  first_seen:
    description: When the ads library first saw the creative running.
  last_seen:
    description: When the ads library last saw the creative running.
  url:
    description: Where the record lives on the platform that published it.
  preview:
    description: The rendered preview image of the creative, where the platform provides one.
  media:
    description: The video or animated creative file, where the platform provides one.
  landing_url:
    description: Where a click on the creative lands.
  case_ref:
    description: The field service ticket a part was used on.

source_priority:
  - salesforce
  - hubspot
  - stripe
  - zendesk
  - intercom
  - shopify
  - woocommerce
  - klaviyo
  - activecampaign
  - sendgrid
  - mailchimp
  - customerio
  - calendly
  - twilio
  - google_ads
  - meta
  - linkedin
  - pinterest
  - snapchat
  - twitter
  - amplitude
  - mixpanel
  - segment
  - smartlook
  - google_analytics
  - google_sheets
  - google_ads_transparency
  - linkedin_ads
  - tiktok_ads
  - meta_ads
  - linkedin_posts
  - x_posts
  - instagram_posts
  - tiktok_posts
  - google_serp

relationships:
  - rel: belongs_to
    from: deal
    to: company
    cardinality: many_to_one
    via: account_ref
  - rel: placed_by
    from: order
    to: person
    cardinality: many_to_one
    match: email
  - rel: sent_to
    from: message
    to: person
    cardinality: many_to_one
    match: phone
  - rel: belongs_to
    from: subscription
    to: company
    cardinality: many_to_one
    via: customer_ref
  - rel: belongs_to
    from: ticket
    to: company
    cardinality: many_to_one
    via: organization_ref
  - rel: raised_by
    from: ticket
    to: person
    cardinality: many_to_one
    match: email
  - rel: performed_by
    from: event
    to: person
    cardinality: many_to_one
    match: email
  - rel: attended_by
    from: meeting
    to: person
    cardinality: many_to_one
    match: email
  - rel: held_with
    from: meeting
    to: company
    cardinality: many_to_one
    match: domain
  - rel: belongs_to
    from: campaign_report
    to: campaign
    cardinality: many_to_one
    via: campaign_ref
  - rel: belongs_to
    from: expense_item
    to: expense
    cardinality: many_to_one
    via: expense_ref
  - rel: belongs_to
    from: bill_item
    to: bill
    cardinality: many_to_one
    via: bill_ref
  - rel: belongs_to
    from: stock_check_item
    to: stock_check
    cardinality: many_to_one
    via: stock_check_ref
  - rel: belongs_to
    from: stock_count_line
    to: stock_count
    cardinality: many_to_one
    via: stock_count_ref
  - rel: belongs_to
    from: perio_tooth
    to: perio_chart
    cardinality: many_to_one
    via: perio_chart_ref
  - rel: belongs_to
    from: perio_site
    to: perio_chart
    cardinality: many_to_one
    via: perio_chart_ref
  - rel: belongs_to
    from: inspection_item
    to: inspection
    cardinality: many_to_one
    via: inspection_ref
  - rel: belongs_to
    from: vehicle_check_item
    to: vehicle_check
    cardinality: many_to_one
    via: vehicle_check_ref
  - rel: belongs_to
    from: temperature_reading
    to: temperature_check
    cardinality: many_to_one
    via: temperature_check_ref
  - rel: belongs_to
    from: safety_finding
    to: safety_walk
    cardinality: many_to_one
    via: safety_walk_ref
  - rel: belongs_to
    from: service_part
    to: ticket
    cardinality: many_to_one
    via: case_ref
  - rel: paid_by
    from: payment
    to: company
    cardinality: many_to_one
    match: name
  - rel: moves
    from: asset_move
    to: asset
    cardinality: many_to_one
    match: code
  - rel: counts
    from: stock_count_line
    to: product
    cardinality: many_to_one
    match: sku
  - rel: admits
    from: check_in
    to: person
    cardinality: many_to_one
    match: email
  - rel: services
    from: service_record
    to: asset
    cardinality: many_to_one
    match: code
  - rel: charts
    from: perio_chart
    to: person
    cardinality: many_to_one
    match: name
  - rel: brought_by
    from: visit_note
    to: person
    cardinality: many_to_one
    match: name
  - rel: requested_by
    from: ticket
    to: company
    cardinality: many_to_one
    match: name
  - rel: delivered_to
    from: delivery
    to: person
    cardinality: many_to_one
    match: name
