entities:
  company:
    description: An organization the business sells to or serves.
    synonyms: [client, account, customer]
    attrs:
      domain: string
      industry: string
      name: string
    identity:
      - domain
  person:
    description: A human the business knows — a contact, a lead or a user at a company.
    synonyms: [contact, lead]
    attrs:
      email: string
      name: string
      phone: string
      title: string
      external_ref: string
    identity:
      - email
      - external_ref
    identity_scope:
      external_ref: tenant
    candidates:
      name: name
      corroborate:
        - phone
        - email_domain
  deal:
    description: A sales opportunity with a value and a forecast close date.
    synonyms: [opportunity]
    attrs:
      name: string
      amount: number
      status: string
      closed_at: date
      currency: string
      account_ref: string
      owner: string
  order:
    description: A completed purchase placed by a person.
    attrs:
      amount: number
      currency: string
      status: string
      email: string
      placed_at: date
  product:
    description: Something the business sells, with a price and a catalogue code.
    attrs:
      name: string
      currency: string
      status: string
      category: string
      sku: string
      price: number
  subscription:
    description: A recurring plan a company pays for, month after month.
    synonyms: [plan]
    attrs:
      customer_ref: string
      mrr: number
      currency: string
      status: string
      started_at: date
  ticket:
    description: A support request raised by a customer and worked to a close.
    synonyms: [case, support request]
    attrs:
      subject: string
      status: string
      priority: string
      channel: string
      email: string
      organization_ref: string
      opened_at: date
  message:
    description: An outbound message sent to a person, such as an SMS.
    attrs:
      status: string
      amount: number
      currency: string
      phone: string
      occurred_at: date
  meeting:
    description: A scheduled call, sometimes with a transcript of what was said.
    synonyms: [call]
    attrs:
      name: string
      status: string
      email: string
      domain: string
      transcript: string
      started_at: date
      ended_at: date
  event:
    description: Something a person did in the product, at a point in time.
    attrs:
      event_name: string
      email: string
      occurred_at: date
  event_definition:
    description: The catalogue entry describing one kind of product event.
    attrs:
      name: string
      category: string
  ad_account:
    description: An advertising account holding campaigns and a budget.
    attrs:
      name: string
      status: string
      currency: string
      country: string
      budget: number
  email_campaign:
    description: One email send to a list, with its open and click counts.
    attrs:
      name: string
      subject: string
      status: string
      sends: number
      opens: number
      clicks: number
      sent_at: date
  audience:
    description: A named list of people a campaign can be sent to.
    attrs:
      name: string
      members: number
  campaign:
    description: A paid advertising campaign, with its spend and its results.
    attrs:
      name: string
      currency: string
      status: string
      category: string
      spend: number
      conversions: number
      clicks: number
      impressions: number
  traffic_report:
    description: One day of website traffic for one channel.
    attrs:
      report_date: date
      channel: string
      sessions: number
      users: number
      pageviews: number
  campaign_report:
    description: "One day of one paid campaign: what it spent and what it got."
    attrs:
      report_date: date
      campaign_ref: string
      spend: number
      clicks: number
      impressions: number
      conversions: number
      currency: string
      platform: string
      conversion_value: number
      landing_page_views: number
  social_post:
    description: One post on a social page or profile, with the engagement it drew.
    synonyms: [post]
    attrs:
      name: string
      platform: string
      category: string
      posted_at: date
      likes: number
      comments: number
      shares: number
      reach: number
      impressions: number
      clicks: number
      views: number
      saves: number
      interactions: number
  social_report:
    description: "One day of one social page or profile: who it reached and who followed."
    attrs:
      platform: string
      report_date: date
      reach: number
      impressions: number
      engaged: number
      follows: number
      unfollows: number
      profile_views: number
  data_source:
    description: An upstream system feeding the estate.
    attrs:
      name: string
      category: string
  competitor:
    description: A company whose marketing this business watches.
    attrs:
      name: string
      domain: string
    identity:
      - domain
  competitor_ad:
    description: One ad a competitor ran, as the platform's public library shows it.
    attrs:
      name: string
      platform: string
      category: string
      competitor_ref: string
      first_seen: date
      last_seen: date
      url: string
  ranking:
    description: One keyword's position for one domain on one day.
    attrs:
      keyword: string
      engine: string
      domain: string
      position: number
      url: string
      checked_on: date
  ai_mention:
    description: Whether an answer engine named a brand for one prompt, and what it cited.
    attrs:
      prompt: string
      engine: string
      brand: string
      mentioned: string
      cited_url: string
      rank: number
      checked_on: date
  competitor_page:
    description: One page on a competitor's site, as it read on the day it was fetched.
    attrs:
      url: string
      name: string
      competitor_ref: string
      body_sha: string
      word_count: number
      fetched_on: date
  competitor_post:
    description: One post a competitor published, with the engagement it drew.
    attrs:
      name: string
      platform: string
      category: string
      competitor_ref: string
      posted_at: date
      likes: number
      comments: number
      url: string

attributes:
  external_ref:
    description: A tenant-scoped id another tool assigned to the person.
    synonyms: [user id, customer id]
  account_ref:
    description: The provider's id for the company a deal belongs to.
  customer_ref:
    description: The provider's id for the company a subscription belongs to.
  organization_ref:
    description: The provider's id for the company a ticket belongs to.
  industry:
    description: The sector the company works in, as its records classify it.
  mrr:
    description: "Monthly recurring revenue: a subscription's own, or the active total across a company's subscriptions."
  status:
    description: Where the record sits in its own lifecycle, folded to one vocabulary.
  category:
    description: The kind of thing the record is, as the source classifies it.
  channel:
    description: The route the contact or the traffic arrived through.
  sends:
    description: How many recipients the email campaign went to.
  members:
    description: How many people the audience holds.
  sessions:
    description: Visits to the site on the reporting day.
  users:
    description: Distinct people who visited the site on the reporting day.
  pageviews:
    description: Pages viewed on the site on the reporting day.
  report_date:
    description: The day the figures cover.
  event_name:
    description: What the person did, as the product names it.
  transcript:
    description: The written record of what was said on the call.
  budget:
    description: What the ad account is allowed to spend.
  spend:
    description: What the campaign spent, in total or on the reporting day.
  conversions:
    description: Actions the campaign counts as a result.
  impressions:
    description: How many times the post, the page or the campaign's ads were shown.
  priority:
    description: How urgent the ticket is, as support graded it.
  sku:
    description: The code that identifies the product in the catalogue.
  title:
    description: The person's job title.
  owner:
    description: Who is accountable for the deal.
  open_tickets:
    description: Support tickets raised by the company that are still open.
  last_meeting_at:
    description: When the person last attended a meeting.
  campaign_ref:
    description: The provider's id for the campaign a daily report belongs to.
  conversion_value:
    description: What the reporting day's conversions were worth, as the ad platform valued them.
  landing_page_views:
    description: How many ad clicks went on to load the landing page.
  platform:
    description: The network the post, the page or the campaign's ads live on.
  posted_at:
    description: When the post went live.
  likes:
    description: How many people liked the post.
  comments:
    description: How many comments the post drew.
  shares:
    description: How many times the post was shared.
  reach:
    description: How many distinct accounts the post or the page reached.
  clicks:
    description: How many clicks the post or the campaign's ads drew.
  views:
    description: How many times the post's video was watched.
  saves:
    description: How many people saved the post.
  interactions:
    description: Likes, comments and shares on the post, added up.
  engaged:
    description: Accounts that interacted with the page on the reporting day.
  follows:
    description: New followers gained on the reporting day.
  unfollows:
    description: Followers lost on the reporting day.
  profile_views:
    description: Visits to the page or profile on the reporting day.
  competitor_ref:
    description: The provider's id for the competitor an ad, a page or a post belongs to.
  first_seen:
    description: When the ad library first showed the ad running.
  last_seen:
    description: When the ad library last showed the ad running; empty while it still runs.
  url:
    description: Where the thing itself can be read or watched, on the platform that holds it.
  keyword:
    description: A search phrase this business wants to be found for.
  engine:
    description: The search or answer service the reading was taken from.
  position:
    description: Where the result sat in the list, counting from the top.
  checked_on:
    description: The day the position or the answer was read.
  prompt:
    description: A question a buyer would type into an answer engine.
  brand:
    description: The company the answer was read for, ours or a competitor's.
  mentioned:
    description: Whether the answer named the brand at all.
  cited_url:
    description: The page the answer pointed at when it named the brand.
  rank:
    description: How far down the answer the brand appeared, counting the brands named before it.
  body_sha:
    description: A fingerprint of the page text, so a rewrite is visible without keeping every copy.
  word_count:
    description: How long the page was on the day it was fetched.
  fetched_on:
    description: The day the page was read.

source_priority:
  - salesforce
  - hubspot
  - stripe
  - zendesk
  - intercom
  - shopify
  - woocommerce
  - klaviyo
  - activecampaign
  - sendgrid
  - mailchimp
  - customerio
  - calendly
  - twilio
  - google_ads
  - meta
  - linkedin
  - pinterest
  - snapchat
  - twitter
  - amplitude
  - mixpanel
  - segment
  - smartlook
  - google_analytics
  - google_sheets
  - meta_ad_library
  - google_ads_transparency
  - serp
  - ai_answers
  - competitor_pages
  - linkedin_posts

relationships:
  - rel: belongs_to
    from: deal
    to: company
    cardinality: many_to_one
    via: account_ref
  - rel: placed_by
    from: order
    to: person
    cardinality: many_to_one
    match: email
  - rel: sent_to
    from: message
    to: person
    cardinality: many_to_one
    match: phone
  - rel: belongs_to
    from: subscription
    to: company
    cardinality: many_to_one
    via: customer_ref
  - rel: belongs_to
    from: ticket
    to: company
    cardinality: many_to_one
    via: organization_ref
  - rel: raised_by
    from: ticket
    to: person
    cardinality: many_to_one
    match: email
  - rel: performed_by
    from: event
    to: person
    cardinality: many_to_one
    match: email
  - rel: attended_by
    from: meeting
    to: person
    cardinality: many_to_one
    match: email
  - rel: held_with
    from: meeting
    to: company
    cardinality: many_to_one
    match: domain
  - rel: belongs_to
    from: campaign_report
    to: campaign
    cardinality: many_to_one
    via: campaign_ref
  - rel: belongs_to
    from: competitor_ad
    to: competitor
    cardinality: many_to_one
    via: competitor_ref
  - rel: belongs_to
    from: competitor_page
    to: competitor
    cardinality: many_to_one
    via: competitor_ref
  - rel: belongs_to
    from: competitor_post
    to: competitor
    cardinality: many_to_one
    via: competitor_ref
