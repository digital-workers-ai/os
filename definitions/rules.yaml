subscription_past_due:
  label: Subscription Past Due
  entity: subscription
  severity: high
  all:
    - {attr: status, equals: past_due}

revenue_at_risk:
  label: Significant Revenue On A Subscription Not Active
  entity: subscription
  severity: high
  all:
    - {attr: mrr, gte: 1000}
    - {attr: status, not_equals: active}

stalled_deal:
  label: Deal Past Its Own Forecast Close Date
  entity: deal
  severity: high
  all:
    - {attr: status, not_equals: closed_won}
    - {attr: status, not_equals: closed_lost}
    - {attr: closed_at, older_than_days: 14}

subscription_canceled:
  label: Subscription Canceled
  entity: subscription
  severity: medium
  all:
    - {attr: status, equals: canceled}

company_without_industry:
  label: Company With No Industry
  entity: company
  severity: low
  all:
    - {attr: industry, is_null: true}

new_subscription:
  label: Subscription Started In The Last 30 Days
  entity: subscription
  severity: low
  all:
    - {attr: started_at, within_days: 30}

paying_company_with_open_tickets:
  label: Paying Company With Open Tickets
  entity: company
  severity: high
  all:
    - {attr: mrr, gte: 1000}
    - {attr: open_tickets, gte: 1}

brand_absent_from_answer:
  label: Brand Absent From A Recent Answer
  entity: visibility_check
  severity: medium
  all:
    - {attr: brand_rank, is_null: true}
    - {attr: checked_at, within_days: 7}

cooler_too_warm:
  label: Cooler Above 41°F
  entity: temperature_reading
  severity: high
  all:
    - {attr: unit, contains: cooler}
    - {attr: temperature, gt: 41}

freezer_too_warm:
  label: Freezer Above 0°F
  entity: temperature_reading
  severity: high
  all:
    - {attr: unit, equals: freezer}
    - {attr: temperature, gt: 0}

hot_food_too_cool:
  label: Hot-Held Food Below 135°F
  entity: temperature_reading
  severity: high
  all:
    - {attr: unit, equals: hot_holding}
    - {attr: temperature, lt: 135}

vehicle_check_failed:
  label: Vehicle Failed A Pre-Trip Check Item
  entity: vehicle_check_item
  severity: high
  all:
    - {attr: result, equals: fail}

serious_safety_hazard:
  label: Safety Hazard That Stops Work
  entity: safety_finding
  severity: high
  all:
    - {attr: severity, equals: high}

machine_out_of_service:
  label: Machine Out Of Service
  entity: service_record
  severity: high
  all:
    - {attr: status, equals: out_of_service}
