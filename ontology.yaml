entities:
  company:
    attrs:
      domain: string
      industry: string
      name: string
    identity:
      - domain
  person:
    attrs:
      email: string
      name: string
      phone: string
      title: string
      external_ref: string
    identity:
      - email
      - external_ref
    identity_scope:
      external_ref: tenant
  deal:
    attrs:
      name: string
      amount: number
      status: string
      closed_at: date
      currency: string
      account_ref: string
      owner: string
  order:
    attrs:
      amount: number
      currency: string
      status: string
      email: string
      placed_at: date
  product:
    attrs:
      name: string
      currency: string
      status: string
      category: string
      sku: string
      price: number
  subscription:
    attrs:
      customer_ref: string
      mrr: number
      currency: string
      status: string
      started_at: date
  ticket:
    attrs:
      subject: string
      status: string
      priority: string
      channel: string
      email: string
      organization_ref: string
      opened_at: date
  message:
    attrs:
      status: string
      amount: number
      currency: string
      phone: string
      occurred_at: date
  meeting:
    attrs:
      name: string
      status: string
      email: string
      domain: string
      transcript: string
      started_at: date
      ended_at: date
  event:
    attrs:
      event_name: string
      email: string
      occurred_at: date
  event_definition:
    attrs:
      name: string
      category: string
  ad_account:
    attrs:
      name: string
      status: string
      currency: string
      country: string
      budget: number
  email_campaign:
    attrs:
      name: string
      subject: string
      status: string
      sends: number
      opens: number
      clicks: number
      sent_at: date
  audience:
    attrs:
      name: string
      members: number
  campaign:
    attrs:
      name: string
      currency: string
      status: string
      category: string
      spend: number
      conversions: number
      clicks: number
      impressions: number
  traffic_report:
    attrs:
      report_date: date
      channel: string
      sessions: number
      users: number
      pageviews: number
  data_source:
    attrs:
      name: string
      category: string

source_priority:
  - salesforce
  - hubspot
  - stripe
  - zendesk
  - intercom
  - shopify
  - woocommerce
  - klaviyo
  - activecampaign
  - sendgrid
  - mailchimp
  - customerio
  - calendly
  - twilio
  - google_ads
  - meta
  - linkedin
  - pinterest
  - snapchat
  - twitter
  - amplitude
  - mixpanel
  - segment
  - smartlook
  - google_analytics
  - google_sheets

relationships:
  - rel: belongs_to
    from: deal
    to: company
    cardinality: many_to_one
    via: account_ref
  - rel: placed_by
    from: order
    to: person
    cardinality: many_to_one
    match: email
  - rel: sent_to
    from: message
    to: person
    cardinality: many_to_one
    match: phone
  - rel: belongs_to
    from: subscription
    to: company
    cardinality: many_to_one
    via: customer_ref
  - rel: belongs_to
    from: ticket
    to: company
    cardinality: many_to_one
    via: organization_ref
  - rel: raised_by
    from: ticket
    to: person
    cardinality: many_to_one
    match: email
  - rel: performed_by
    from: event
    to: person
    cardinality: many_to_one
    match: email
  - rel: attended_by
    from: meeting
    to: person
    cardinality: many_to_one
    match: email
  - rel: held_with
    from: meeting
    to: company
    cardinality: many_to_one
    match: domain
