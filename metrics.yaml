mrr:
  label: MRR
  entity: subscription
  expression: SUM(mrr)
  filter:
    status: active

contracted_mrr:
  label: Contracted MRR
  entity: subscription
  expression: SUM(mrr)

avg_mrr:
  label: Average MRR
  entity: subscription
  expression: AVG(mrr)
  filter:
    status: active

subscription_count:
  label: Subscriptions
  entity: subscription
  expression: COUNT(entity)

active_subscriptions:
  label: Active Subscriptions
  entity: subscription
  expression: COUNT(entity)
  filter:
    status: active

churned_subscriptions:
  label: Churned Subscriptions
  entity: subscription
  expression: COUNT(entity)
  filter:
    status: canceled

deal_count:
  label: Deals
  entity: deal
  expression: COUNT(entity)

won_value:
  label: Won Value
  entity: deal
  expression: SUM(amount)
  filter:
    status: closed_won

company_count:
  label: Companies
  entity: company
  expression: COUNT(entity)

companies_with_industry:
  label: Companies with Industry
  entity: company
  expression: COUNT(industry)

avg_deal_size:
  label: Average Deal Size
  entity: deal
  expression: AVG(amount)

strong_interest_share:
  label: Share of Read Calls with Strong Interest
  entity: meeting
  source: enriched
  inferred: true
  reading: sales_call
  op: "/"
  terms:
    - expression: COUNT(entity)
      filter:
        interest: strong
    - expression: COUNT(entity)
      filter: {}

calls_citing_pricing:
  label: Read Calls Citing Pricing
  entity: meeting
  source: enriched
  inferred: true
  reading: sales_call
  expression: COUNT(entity)
  filter:
    pain_points: pricing

pain_points_per_read_call:
  label: Pain Points Named per Read Call
  entity: meeting
  source: enriched
  inferred: true
  reading: sales_call
  op: "/"
  terms:
    - expression: COUNT(pain_points)
      filter: {}
    - expression: COUNT(entity)
      filter: {}
