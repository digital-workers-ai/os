[alembic]
script_location = %(here)s/alembic
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .

[post_write_hooks]
hooks = strip, lint, format
strip.type = exec
strip.executable = python
strip.options = -m tools.strip_comments REVISION_SCRIPT_FILENAME
lint.type = exec
lint.executable = ruff
lint.options = check --fix REVISION_SCRIPT_FILENAME
format.type = exec
format.executable = ruff
format.options = format REVISION_SCRIPT_FILENAME
