name: os_studio

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: os
      POSTGRES_PASSWORD: os
      POSTGRES_DB: os
    ports:
      - "6442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U os"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "9092:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://os:os@postgres:5432/os
      MOCK_BASE_URL: http://mock:8100
    depends_on:
      postgres:
        condition: service_healthy
      mock:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ../definitions:/app/definitions
      - ../.claude/skills:/app/.claude/skills:ro
      - ../mock:/adversarial/seeds:ro
      - media:/media
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 5s
      timeout: 5s
      retries: 15

  mock:
    build:
      context: ../mock
      dockerfile: Dockerfile
    ports:
      - "9192:8100"
    volumes:
      - ../mock:/app/seeds
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8100/health')\""]
      interval: 5s
      timeout: 5s
      retries: 15

  console:
    build:
      context: ./console
      dockerfile: Dockerfile
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "4092:3000"
    environment:
      BACKEND_URL: http://backend:8000
    volumes:
      - ./console:/app
      - console_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "4093:3000"
    environment:
      BACKEND_URL: http://backend:8000
    volumes:
      - ./dashboard:/app
      - dashboard_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 90

  studio:
    build:
      context: ./studio
      dockerfile: Dockerfile
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "4094:3000"
    environment:
      BACKEND_URL: http://backend:8000
    volumes:
      - ./studio:/app
      - studio_node_modules:/app/node_modules
      - media:/media
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 90

  playwright:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    profiles: ["snap"]
    working_dir: /app
    volumes:
      - ./e2e:/app
      - ./console/src:/console/src:ro
      - e2e_node_modules:/app/node_modules
    environment:
      BASE_URL: http://console:3000
      DASHBOARD_URL: http://dashboard:3000
      CI: "1"
    depends_on:
      console:
        condition: service_started
      dashboard:
        condition: service_healthy
    ipc: host

volumes:
  pgdata:
  media:
  console_node_modules:
  dashboard_node_modules:
  studio_node_modules:
  e2e_node_modules:
