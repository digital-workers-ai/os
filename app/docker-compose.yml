name: os_v0

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: os
      POSTGRES_PASSWORD: os
      POSTGRES_DB: os_v0
    ports:
      - "5442:5432"
    volumes:
      - pgdata_v0:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U os"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8092:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://os:os@postgres:5432/os_v0
      MOCK_BASE_URL: http://mock:8100
    depends_on:
      postgres:
        condition: service_healthy
      mock:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ../mappings.yaml:/app/mappings.yaml
      - ../ontology.yaml:/app/ontology.yaml
      - ../transforms.yaml:/app/transforms.yaml
      - ../synonyms.yaml:/app/synonyms.yaml
      - ../metrics.yaml:/app/metrics.yaml
      - ../rules.yaml:/app/rules.yaml
      - ../goals.yaml:/app/goals.yaml
      - ../enrichment.yaml:/app/enrichment.yaml
      - ../mock:/adversarial/seeds:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 5s
      timeout: 5s
      retries: 15

  mock:
    build:
      context: ../mock
      dockerfile: Dockerfile
    ports:
      - "8192:8100"
    volumes:
      - ../mock:/app/seeds
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8100/health')\""]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  pgdata_v0:
