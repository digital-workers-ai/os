services:
  postgres:
    ports: !reset []

  mock:
    ports: !reset []

  backend:
    ports: !reset []
    environment:
      ENRICHMENT_ENABLED: "false"
      COACHING_ENABLED: "false"
      EMBEDDINGS_ENABLED: "false"
      RERANK_ENABLED: "false"
      CLOCK_PINNED_AT: "2026-09-04T12:00:00Z"

  frontend:
    ports: !reset []

  playwright:
    environment:
      CLOCK_PINNED_AT: "2026-09-04T12:00:00Z"

volumes:
  frontend_node_modules:
    external: true
    name: os_frontend_node_modules
