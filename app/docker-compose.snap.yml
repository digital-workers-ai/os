services:
  postgres:
    ports: !reset []

  mock:
    ports: !reset []

  backend:
    ports: !reset []
    environment:
      STAND_INS_ONLY: "true"
      ENRICHMENT_ENABLED: "false"
      COACHING_ENABLED: "false"
      EMBEDDINGS_ENABLED: "false"
      RERANK_ENABLED: "false"
      STUDIO_ENABLED: "false"
      MARKETER_DAILY: "false"
      CLOCK_PINNED_AT: "2026-09-04T12:00:00Z"

  console:
    ports: !reset []

  dashboard:
    ports: !reset []

  studio:
    ports: !reset []

  playwright:
    environment:
      CLOCK_PINNED_AT: "2026-09-04T12:00:00Z"

volumes:
  console_node_modules:
    external: true
    name: os_studio_console_node_modules
