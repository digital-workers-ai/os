x-pinned-clock: &pinned-clock
  CLOCK_PINNED_AT: "2026-09-04T12:00:00Z"

services:
  postgres:
    ports: !reset []

  mock:
    ports: !reset []

  backend:
    ports: !reset []
    environment:
      <<: *pinned-clock
      ENRICHMENT_ENABLED: "false"
      COACHING_ENABLED: "false"
      EMBEDDINGS_ENABLED: "false"
      RERANK_ENABLED: "false"

  frontend:
    ports: !reset []

  playwright:
    environment:
      <<: *pinned-clock

volumes:
  frontend_node_modules:
    external: true
    name: os_frontend_node_modules
