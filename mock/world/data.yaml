sales_calls:
- id: zc1
  company_id: c5
  prospect_id: p11
  host_email: jane@os.dev
  topic: Wayne Enterprises <> OS — pricing and rollout
  started_at: '2026-07-08T15:00:00Z'
  duration_min: 34
  transcript:
  - {speaker: Jane Smith (OS), line: 'Thanks for making time. Where did you land after the trial?'}
  - {speaker: Bruce Wayne, line: Honestly the trial sold it. My team stopped exporting to spreadsheets on day two.}
  - {speaker: Jane Smith (OS), line: 'Good to hear. Anything still blocking?'}
  - {speaker: Bruce Wayne, line: 'Two things. The per-seat price is above what we budgeted, and getting the data in took our engineer most of a week.'}
  - {speaker: Jane Smith (OS), line: 'Understood on both. What''s your timeline?'}
  - {speaker: Bruce Wayne, line: 'We want to sign before the end of this quarter. Procurement needs two weeks, so realistically mid-September.'}
  - {speaker: Jane Smith (OS), line: I'll get you a revised quote today.}
  - {speaker: Bruce Wayne, line: Do that and we're moving forward.}
  expected_interest: strong
  expected_pain: [pricing, onboarding_time]
  expected_timing: this_quarter
  note: clear buying signal, two named objections
- id: zc2
  company_id: c3
  prospect_id: p7
  host_email: jane@os.dev
  topic: Initech — renewal check-in
  started_at: '2026-07-11T09:30:00Z'
  duration_min: 21
  transcript:
  - {speaker: Jane Smith (OS), line: Wanted to check in ahead of the renewal.}
  - {speaker: Tom Williams, line: 'I''ll be straight with you, the team has mostly stopped using it.'}
  - {speaker: Jane Smith (OS), line: 'Sorry to hear that. What happened?'}
  - {speaker: Tom Williams, line: The integration with our warehouse broke after your update in May and it took three weeks to get a reply from support. By then people had gone back to the old process.}
  - {speaker: Jane Smith (OS), line: 'That''s on us. If we fixed the integration would you reconsider?'}
  - {speaker: Tom Williams, line: Maybe. But I'm not putting it to the board this year. Ask me again in the new financial year.}
  - {speaker: Jane Smith (OS), line: Understood.}
  expected_interest: weak
  expected_pain: [integration_complexity, support_quality]
  expected_timing: next_year
  note: churn risk — the tickets in TICKETS corroborate this
- id: zc3
  company_id: c2
  prospect_id: p4
  host_email: alex@os.dev
  topic: Globex — expansion to the growth team
  started_at: '2026-07-14T13:00:00Z'
  duration_min: 28
  transcript:
  - {speaker: Alex Chen (OS), line: You mentioned wanting to bring Lisa's team on.}
  - {speaker: Mike Chen, line: Yes. Marketing wants the same reporting sales has.}
